<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="予算を決めて、買い物中の合計金額と残額を確認できるシンプルな買い物電卓です。">
  <title>買い物電卓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="start-view" class="view start-view" aria-labelledby="start-title">
      <div class="start-view__icon" aria-hidden="true">🛒</div>
      <p class="eyebrow">SHOPPING CALCULATOR</p>
      <h1 id="start-title">今日の予算は？</h1>
      <p class="lead">最初に予算を決めて、使える金額を見ながら買い物しましょう。</p>

      <form id="budget-form" class="budget-form">
        <label for="budget">予算</label>
        <div class="money-input money-input--large">
          <span aria-hidden="true">¥</span>
          <input
            id="budget"
            name="budget"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            placeholder="例: 5,000"
            required
          >
        </div>
        <p id="budget-error" class="error-message" aria-live="polite"></p>
        <button class="primary-button primary-button--full" type="submit">買い物を始める</button>
      </form>
    </section>

    <section id="shopping-view" class="view shopping-view" aria-labelledby="shopping-title" hidden>
      <header class="shopping-header">
        <div>
          <p class="eyebrow">SHOPPING CALCULATOR</p>
          <h1 id="shopping-title">買い物中</h1>
        </div>
        <button id="restart-button" class="text-button" type="button">予算を変更</button>
      </header>

      <section class="budget-summary" aria-label="予算状況">
        <div>
          <span>予算</span>
          <strong id="budget-price">¥0</strong>
        </div>
        <div>
          <span>残り</span>
          <strong id="remaining-price">¥0</strong>
        </div>
      </section>

      <form id="price-form" class="price-form">
        <div class="input-row">
          <div class="input-field">
            <label for="price">商品の値段</label>
            <div class="money-input">
              <span aria-hidden="true">¥</span>
              <input
                id="price"
                name="price"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="例: 980"
                required
              >
            </div>
          </div>

          <div class="input-field input-field--quantity">
            <label for="quantity">個数</label>
            <div class="quantity-input">
              <input
                id="quantity"
                name="quantity"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
                value="1"
                required
              >
              <span aria-hidden="true">個</span>
            </div>
          </div>

          <button class="primary-button input-row__button" type="submit">追加</button>
        </div>
        <p id="error-message" class="error-message" aria-live="polite"></p>
      </form>

      <section class="items-section" aria-labelledby="items-title">
        <div class="section-heading">
          <h2 id="items-title">入力した商品</h2>
          <button id="clear-button" class="text-button text-button--danger" type="button">すべて削除</button>
        </div>
        <ul id="item-list" class="item-list"></ul>
        <p id="empty-message" class="empty-message">まだ商品がありません。</p>
      </section>

      <section class="total-card" aria-label="合計金額">
        <span>合計</span>
        <strong id="total-price">¥0</strong>
        <small id="item-count">0点</small>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
