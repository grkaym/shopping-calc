<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="商品の価格を入力して買い物の合計金額を計算できるシンプルな電卓です。">
  <title>買い物電卓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="calculator__header">
      <p class="eyebrow">SHOPPING CALCULATOR</p>
      <h1>買い物電卓</h1>
      <p>商品の金額を入力すると、合計をすぐに計算します。</p>
    </header>

    <form id="price-form" class="price-form">
      <label for="price">商品の値段</label>
      <div class="input-row">
        <div class="price-input">
          <span aria-hidden="true">¥</span>
          <input
            id="price"
            name="price"
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            placeholder="例: 980"
            required
          >
        </div>
        <button type="submit">追加</button>
      </div>
      <p id="error-message" class="error-message" aria-live="polite"></p>
    </form>

    <section class="items-section" aria-labelledby="items-title">
      <div class="section-heading">
        <h2 id="items-title">入力した商品</h2>
        <button id="clear-button" class="text-button" type="button">すべて削除</button>
      </div>
      <ul id="item-list" class="item-list"></ul>
      <p id="empty-message" class="empty-message">まだ商品がありません。</p>
    </section>

    <section class="total-card" aria-label="合計金額">
      <span>合計</span>
      <strong id="total-price">¥0</strong>
      <small id="item-count">0点</small>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
